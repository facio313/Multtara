# 개발 환경 오버라이드
# 사용법: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    stop_grace_period: 1m
    shm_size: 256mb
    mem_limit: ${DB_MEMORY_LIMIT:-1g}
    cpus: ${DB_CPU_LIMIT:-1.5}
    pids_limit: ${DB_PIDS_LIMIT:-200}
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILES:-5}
    volumes:
      - postgres16_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pongdang}
      POSTGRES_USER: ${POSTGRES_USER:-pongdang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    command: >
      postgres
        -c shared_buffers=256MB
        -c work_mem=16MB
        -c effective_cache_size=512MB
        -c maintenance_work_mem=64MB
        -c max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pongdang} -d ${POSTGRES_DB:-pongdang}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${DEV_POSTGRES_PORT:-5432}:5432"

  backend:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: ./backend
      args:
        PORTFOLIO_BRANCH: ${PORTFOLIO_BRANCH:?PORTFOLIO_BRANCH is required}
        PORTFOLIO_AUTH_MODE: ${PORTFOLIO_AUTH_MODE:?PORTFOLIO_AUTH_MODE is required}
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: ${LOCAL_DATABASE_URL:?LOCAL_DATABASE_URL is required}
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DEBUG: "True"
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
      TOUR_API_KEY: ${TOUR_API_KEY:-}
      KMA_API_KEY: ${KMA_API_KEY:-}
      KHOA_API_KEY: ${KHOA_API_KEY:-}
      MOE_API_KEY: ${MOE_API_KEY:-}
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${DEV_BACKEND_PORT:-8000}:8000"

  collector:
    environment:
      DATABASE_URL: ${LOCAL_DATABASE_URL:?LOCAL_DATABASE_URL is required}
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DEBUG: "True"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: builder
      args:
        PORTFOLIO_BRANCH: ${PORTFOLIO_BRANCH:?PORTFOLIO_BRANCH is required}
        PORTFOLIO_AUTH_MODE: ${PORTFOLIO_AUTH_MODE:?PORTFOLIO_AUTH_MODE is required}
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:${DEV_BACKEND_PORT:-8000}/api/v1/
      VITE_KAKAO_MAP_KEY: ${VITE_KAKAO_MAP_KEY:-}
    # Replace the production 8080:80 publication inherited from the base file.
    ports: !override
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${DEV_FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5173/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  # Deliberately differs from the former PostgreSQL 15 volume. PostgreSQL 16
  # must never try to open a PG15 data directory in place.
  postgres16_data:
    driver: local
