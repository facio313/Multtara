# 개발 환경 오버라이드
# 사용법: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  db:
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${DEV_POSTGRES_PORT:-5432}:5432"

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DEBUG: "True"
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
      TOUR_API_KEY: ${TOUR_API_KEY:-}
      KMA_API_KEY: ${KMA_API_KEY:-}
      KHOA_API_KEY: ${KHOA_API_KEY:-}
      MOE_API_KEY: ${MOE_API_KEY:-}
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${DEV_BACKEND_PORT:-8000}:8000"

  collector:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DEBUG: "True"

  frontend:
    build:
      context: ./frontend
      target: builder
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:${DEV_BACKEND_PORT:-8000}/api/v1/
      VITE_KAKAO_MAP_KEY: ${VITE_KAKAO_MAP_KEY:-}
    # Replace the production 8080:80 publication inherited from the base file.
    ports: !override
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${DEV_FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5173/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
