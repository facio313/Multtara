<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fe6d1e"/>
      <stop offset="0.42" stop-color="#ff8536"/>
      <stop offset="1" stop-color="#f7d548"/>
    </linearGradient>
    <filter id="marble" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016 0.028" numOctaves="4" seed="9" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="
        1 0 0 0 0
        0 0.55 0 0 0
        0 0 0.12 0 0
        0 0 0 0.65 0.2" result="tint"/>
      <feBlend in="tint" in2="SourceGraphic" mode="overlay"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#base)" filter="url(#marble)"/>
</svg>
