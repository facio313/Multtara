# These origin limits deliberately use the TCP peer address. Client-supplied
# forwarding headers are not a trustworthy rate-limit key; the trusted HTTPS
# edge is responsible for additional end-user/IP limits before reaching origin.
limit_req_zone $binary_remote_addr zone=pongdang_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=pongdang_recommendations:10m rate=10r/m;

server {
    listen 8080;
    server_name localhost;
    server_tokens off;
    client_max_body_size 1m;
    limit_req_status 429;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/v1/trips/recommendations/ {
        limit_req zone=pongdang_api burst=20 nodelay;
        limit_req zone=pongdang_recommendations burst=3 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Remote-User $http_remote_user;
        proxy_set_header Remote-Email $http_remote_email;
        proxy_set_header Remote-Name $http_remote_name;
        proxy_set_header Remote-Groups $http_remote_groups;
        proxy_set_header X-Portfolio-Edge-Secret $http_x_portfolio_edge_secret;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /api/ {
        limit_req zone=pongdang_api burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Preserve HTTPS information from the trusted edge proxy. A direct
        # HTTP request sends an empty value and Django's production redirect
        # policy remains fail-closed.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Remote-User $http_remote_user;
        proxy_set_header Remote-Email $http_remote_email;
        proxy_set_header Remote-Name $http_remote_name;
        proxy_set_header Remote-Groups $http_remote_groups;
        proxy_set_header X-Portfolio-Edge-Secret $http_x_portfolio_edge_secret;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Portfolio account administration lives at the central /sso/admin/
    # surface. Never expose a second, independently authenticated Django admin
    # session through the shared /multtara origin.
    location = /admin {
        return 404;
    }

    location /admin/ {
        return 404;
    }

    # collectstatic output is served by WhiteNoise through Django. Preserve the
    # same host and trusted-edge scheme contract as API requests so production
    # host validation and HTTPS redirects behave consistently.
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header X-Frame-Options "DENY" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header X-Frame-Options "DENY" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
