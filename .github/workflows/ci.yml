name: CI

on:
  workflow_call:
    inputs:
      portfolio_branch:
        description: Source branch whose authentication contract is being validated
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main
      - codex
      - "codex-*"
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  PORTFOLIO_BRANCH: ${{ inputs.portfolio_branch || github.head_ref || github.ref_name }}
  PORTFOLIO_AUTH_MODE: ${{ (inputs.portfolio_branch == 'main' || inputs.portfolio_branch == 'dev' || github.head_ref == 'main' || github.head_ref == 'dev' || github.ref_name == 'main' || github.ref_name == 'dev') && 'sso' || 'local' }}
  PONGDANG_SSO_ENABLED: ${{ (inputs.portfolio_branch == 'main' || inputs.portfolio_branch == 'dev' || github.head_ref == 'main' || github.head_ref == 'dev' || github.ref_name == 'main' || github.ref_name == 'dev') && 'true' || 'false' }}
  VITE_SSO_ENABLED: ${{ (inputs.portfolio_branch == 'main' || inputs.portfolio_branch == 'dev' || github.head_ref == 'main' || github.head_ref == 'dev' || github.ref_name == 'main' || github.ref_name == 'dev') && 'true' || 'false' }}

jobs:
  backend:
    name: Backend / PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: pongdang_test
          POSTGRES_USER: pongdang
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pongdang -d pongdang_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.base
      SECRET_KEY: ci-only-django-secret-key
      DATABASE_URL: postgresql://pongdang:ci-postgres-password@127.0.0.1:5432/pongdang_test
      PONGDANG_SSO_EDGE_SECRET: ci-only-pongdang-edge-secret-value-2026
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate branch-bound authentication contract
        working-directory: .
        run: scripts/test-portfolio-auth-mode.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Run migrations against PostgreSQL
        run: python manage.py migrate --noinput

      - name: Run backend tests against PostgreSQL
        run: python manage.py test --verbosity=2

      - name: Reject uncommitted model changes
        run: python manage.py makemigrations --check --dry-run

      - name: Validate production deployment settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          SECRET_KEY: ci-production-only-secret-key-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ
          DATABASE_URL: postgresql://pongdang:ci-postgres-password@127.0.0.1:5432/pongdang_test
          ALLOWED_HOSTS: localhost
          CORS_ALLOWED_ORIGINS: ""
          SECURE_SSL_REDIRECT: "True"
        run: python manage.py check --deploy

      - name: Audit backend dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit --require-hashes -r requirements.lock

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate branch-bound authentication contract
        working-directory: .
        run: scripts/test-portfolio-auth-mode.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build Docker/Nginx bundle
        env:
          VITE_API_BASE_URL: /api/v1/
          VITE_KAKAO_MAP_KEY: ""
        run: npm run build

      - name: Build Sites bundle
        env:
          VITE_API_BASE_URL: /api/v1/
          VITE_KAKAO_MAP_KEY: ""
        run: npm run build:sites

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  configuration:
    name: Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_DB: pongdang
      POSTGRES_USER: pongdang
      POSTGRES_PASSWORD: ci-postgres-password
      DATABASE_URL: postgresql://pongdang:ci-postgres-password@db:5432/pongdang
      SECRET_KEY: ci-production-only-secret-key-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ
      ALLOWED_HOSTS: localhost
      CORS_ALLOWED_ORIGINS: ""
      SECURE_SSL_REDIRECT: "True"
      VITE_API_BASE_URL: /api/v1/
      VITE_KAKAO_MAP_KEY: ""
      BACKEND_IMAGE: ghcr.io/example/pongdang/backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      FRONTEND_IMAGE: ghcr.io/example/pongdang/frontend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate branch-bound authentication contract
        run: scripts/test-portfolio-auth-mode.sh

      - name: Render production Compose configuration
        run: docker compose -f docker-compose.yml config --quiet

      - name: Render development Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

      - name: Render immutable production deployment configuration
        run: docker compose -f docker-compose.yml -f docker-compose.deploy.yml config --quiet

      - name: Run operations contract tests
        run: scripts/test-ops-config.sh

      - name: Lint shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
          shellcheck scripts/*.sh backend/*.sh

  images:
    name: Images / linux-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: .
            dockerfile: ./frontend/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} for Raspberry Pi
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: |
            PORTFOLIO_BRANCH=${{ env.PORTFOLIO_BRANCH }}
            PORTFOLIO_AUTH_MODE=${{ env.PORTFOLIO_AUTH_MODE }}
            VITE_SSO_ENABLED=${{ env.VITE_SSO_ENABLED }}
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-arm64
