services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    init: true
    stop_grace_period: 1m
    shm_size: 256mb
    mem_limit: ${DB_MEMORY_LIMIT:-1g}
    cpus: ${DB_CPU_LIMIT:-1.5}
    pids_limit: ${DB_PIDS_LIMIT:-200}
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILES:-5}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pongdang}
      POSTGRES_USER: ${POSTGRES_USER:-pongdang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    # Raspberry Pi 5 메모리 튜닝 (4GB/8GB 기준)
    command: >
      postgres
        -c shared_buffers=256MB
        -c work_mem=16MB
        -c effective_cache_size=512MB
        -c maintenance_work_mem=64MB
        -c max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pongdang} -d ${POSTGRES_DB:-pongdang}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./backend
    # Rootless Docker maps the deployment user's host UID/GID to container
    # root. Keep the application UID non-root and use only container group 0
    # to read the host-owned mode-0640 edge-secret bind.
    user: "${PONGDANG_BACKEND_RUNTIME_USER:-pongdang:root}"
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /app/staticfiles:rw,noexec,nosuid,nodev,size=128m,mode=1777
    volumes:
      - type: bind
        source: ${PONGDANG_SSO_EDGE_SECRET_MOUNT:-/dev/null}
        target: /run/secrets/pongdang_sso_edge_secret
        read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${BACKEND_MEMORY_LIMIT:-768m}
    cpus: ${BACKEND_CPU_LIMIT:-2.0}
    pids_limit: ${BACKEND_PIDS_LIMIT:-256}
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILES:-5}
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Pass a real RFC 3986 database URL instead of interpolating raw
      # credentials into one. Reserved characters in user/password components
      # must be percent-encoded by the deployment secret manager.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      APPLICATION_BASE_PATH: ${APPLICATION_BASE_PATH:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      PONGDANG_SSO_ENABLED: ${PONGDANG_SSO_ENABLED:-false}
      PONGDANG_SSO_EDGE_SECRET: ${PONGDANG_SSO_EDGE_SECRET:-}
      PONGDANG_SSO_EDGE_SECRET_FILE: ${PONGDANG_SSO_EDGE_SECRET_FILE:-}
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
      TOUR_API_KEY: ${TOUR_API_KEY:-}
      KMA_API_KEY: ${KMA_API_KEY:-}
      KHOA_API_KEY: ${KHOA_API_KEY:-}
      MOE_API_KEY: ${MOE_API_KEY:-}
      ROUTING_MATRIX_URL: ${ROUTING_MATRIX_URL:-}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; host=os.environ['ALLOWED_HOSTS'].split(',')[0].strip().lstrip('.'); request=urllib.request.Request('http://127.0.0.1:8000/api/health/ready/', headers={'Host': host, 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  collector:
    build: ./backend
    restart: unless-stopped
    entrypoint: []
    init: true
    stop_grace_period: 1m
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${COLLECTOR_MEMORY_LIMIT:-512m}
    cpus: ${COLLECTOR_CPU_LIMIT:-1.0}
    pids_limit: ${COLLECTOR_PIDS_LIMIT:-128}
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILES:-5}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      APPLICATION_BASE_PATH: ${APPLICATION_BASE_PATH:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
      TOUR_API_KEY: ${TOUR_API_KEY:-}
      KMA_API_KEY: ${KMA_API_KEY:-}
      KHOA_API_KEY: ${KHOA_API_KEY:-}
      MOE_API_KEY: ${MOE_API_KEY:-}
      ROUTING_MATRIX_URL: ${ROUTING_MATRIX_URL:-}
    command:
      - python
      - manage.py
      - run_condition_pipeline
      - --weather-interval=${WEATHER_SYNC_INTERVAL_SECONDS:-1800}
      - --marine-interval=${MARINE_SYNC_INTERVAL_SECONDS:-3600}
      - --evaluate-interval=${WATER_INDEX_INTERVAL_SECONDS:-300}
      - --route-matrix-interval=${ROUTE_MATRIX_INTERVAL_SECONDS:-86400}
    healthcheck:
      test:
        - CMD
        - python
        - manage.py
        - check_condition_pipeline_health
        - --max-age
        - "900"
      interval: 1m
      timeout: 20s
      retries: 3
      start_period: 2m

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_BASE_PATH: ${VITE_APP_BASE_PATH:-/}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1/}
        VITE_KAKAO_MAP_KEY: ${VITE_KAKAO_MAP_KEY:-}
        VITE_CSRF_COOKIE_NAME: ${VITE_CSRF_COOKIE_NAME:-pongdang_csrftoken}
        VITE_SSO_ENABLED: ${VITE_SSO_ENABLED:-false}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /var/run:rw,noexec,nosuid,nodev,size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-128m}
    cpus: ${FRONTEND_CPU_LIMIT:-0.5}
    pids_limit: ${FRONTEND_PIDS_LIMIT:-64}
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILES:-5}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Production HTTP is loopback-only by default. Terminate HTTPS in a
      # trusted host/edge proxy and forward to this address; do not expose the
      # container port directly while trusting X-Forwarded-Proto.
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
