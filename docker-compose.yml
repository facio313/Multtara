services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pongdang}
      POSTGRES_USER: ${POSTGRES_USER:-pongdang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pongdang_secret}
    # Raspberry Pi 5 메모리 튜닝 (4GB/8GB 기준)
    command: >
      postgres
        -c shared_buffers=256MB
        -c work_mem=16MB
        -c effective_cache_size=512MB
        -c maintenance_work_mem=64MB
        -c max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pongdang} -d ${POSTGRES_DB:-pongdang}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pongdang}:${POSTGRES_PASSWORD:-pongdang_secret}@db:5432/${POSTGRES_DB:-pongdang}
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - DATA_GO_KR_SERVICE_KEY=${DATA_GO_KR_SERVICE_KEY:-}
      - TOUR_API_KEY=${TOUR_API_KEY:-}
      - KMA_API_KEY=${KMA_API_KEY:-}
      - KHOA_API_KEY=${KHOA_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media

  refresher:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pongdang}:${POSTGRES_PASSWORD:-pongdang_secret}@db:5432/${POSTGRES_DB:-pongdang}
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATA_GO_KR_SERVICE_KEY=${DATA_GO_KR_SERVICE_KEY:-}
      - TOUR_API_KEY=${TOUR_API_KEY:-}
      - KMA_API_KEY=${KMA_API_KEY:-}
      - KHOA_API_KEY=${KHOA_API_KEY:-}
    command: python manage.py refresh_conditions --skip-tour --loop --interval ${REFRESH_INTERVAL_SECONDS:-10800}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_KAKAO_MAP_KEY: ${VITE_KAKAO_MAP_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
    driver: local
  media_data:
    driver: local
