services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pongdang}
      POSTGRES_USER: ${POSTGRES_USER:-pongdang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    # Raspberry Pi 5 메모리 튜닝 (4GB/8GB 기준)
    command: >
      postgres
        -c shared_buffers=256MB
        -c work_mem=16MB
        -c effective_cache_size=512MB
        -c maintenance_work_mem=64MB
        -c max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pongdang} -d ${POSTGRES_DB:-pongdang}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pongdang}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-pongdang}
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      - DATA_GO_KR_SERVICE_KEY=${DATA_GO_KR_SERVICE_KEY:-}
      - TOUR_API_KEY=${TOUR_API_KEY:-}
      - KMA_API_KEY=${KMA_API_KEY:-}
      - KHOA_API_KEY=${KHOA_API_KEY:-}
      - MOE_API_KEY=${MOE_API_KEY:-}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; host=os.environ['ALLOWED_HOSTS'].split(',')[0].strip(); request=urllib.request.Request('http://127.0.0.1:8000/api/health/ready/', headers={'Host': host, 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  collector:
    build: ./backend
    restart: unless-stopped
    entrypoint: []
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pongdang}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-pongdang}
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      - DATA_GO_KR_SERVICE_KEY=${DATA_GO_KR_SERVICE_KEY:-}
      - TOUR_API_KEY=${TOUR_API_KEY:-}
      - KMA_API_KEY=${KMA_API_KEY:-}
      - KHOA_API_KEY=${KHOA_API_KEY:-}
      - MOE_API_KEY=${MOE_API_KEY:-}
    command:
      - python
      - manage.py
      - run_condition_pipeline
      - --weather-interval=${WEATHER_SYNC_INTERVAL_SECONDS:-1800}
      - --marine-interval=${MARINE_SYNC_INTERVAL_SECONDS:-3600}
      - --evaluate-interval=${WATER_INDEX_INTERVAL_SECONDS:-300}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1/}
        VITE_KAKAO_MAP_KEY: ${VITE_KAKAO_MAP_KEY:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Production HTTP is loopback-only by default. Terminate HTTPS in a
      # trusted host/edge proxy and forward to this address; do not expose the
      # container port directly while trusting X-Forwarded-Proto.
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
